version: "3.9"

# ── OralAI Docker Compose ──
# One-command startup: docker compose up
#
# Services:
#   backend  — Flask AI REST API (port 5000)
#   frontend — Static file server for the SPA (port 8080)

services:

  # ── Flask AI Backend ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oralai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - MODEL_PATH=model/oral_cnn.h5
      - IMG_SIZE=224
      - LOG_LEVEL=INFO
      - RATE_LIMIT_PER_MINUTE=20
    volumes:
      # Mount the model directory so you can drop in a new model without rebuilding
      - ./backend/model:/app/model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend static server ────────────────────────
  frontend:
    image: nginx:1.25-alpine
    container_name: oralai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

# ── Networks ─────────────────────────────────────────
networks:
  default:
    name: oralai-network
